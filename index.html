<script>
  // Base path (GitHub Pages project sites live under /<repo>/) + restore a deep link sent here by 404.html as ?r=.
  (function () {
    var l = location, seg = l.hostname.endsWith('github.io') ? l.pathname.split('/')[1] : '';
    window.__BASE = seg ? '/' + seg + '/' : '/';
    var p = new URLSearchParams(l.search), r = p.get('r');
    if (r != null) { p.delete('r'); var q = p.toString(); history.replaceState(null, '', window.__BASE + r.replace(/^\//, '') + (q ? '?' + q : '') + l.hash); }
    document.write('<base href="' + window.__BASE + '">');
  })();
</script>
